name: PR Validation

on:
  pull_request:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node and Linters
        run: |
          npm install -g htmlhint stylelint
          npm install

      - name: Lint HTML
        run: htmlhint src/**/*.html

      - name: Lint CSS
        run: stylelint "**/*.css"

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          npm install
          npm install -g parcel

      - name: Build Website
        run: parcel build src/index.html
